<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Percentage Calculator - MyHelp India</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f8ff;
    color:#222;
}

header{
    background:linear-gradient(135deg,#0d47a1,#1976d2,#42a5f5);
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    font-size:30px;
    margin-bottom:8px;
}

header p{
    font-size:15px;
}

.container{
    max-width:850px;
    margin:30px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
    margin-bottom:25px;
}

h2{
    color:#0d47a1;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#1976d2;
}

.button-area{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:22px;
}

button,.back-btn{
    border:none;
    padding:13px 20px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.calculate{
    background:#1976d2;
    color:white;
}

.clear{
    background:#e53935;
    color:white;
}

.back-btn{
    background:#555;
    color:white;
    text-decoration:none;
    display:inline-block;
}

.results{
    display:none;
}

.answer{
    text-align:center;
    background:#e8f5e9;
    border-radius:14px;
    padding:25px;
    margin-bottom:20px;
}

.answer h3{
    color:#2e7d32;
    margin-bottom:10px;
}

.answer p{
    font-size:36px;
    font-weight:bold;
    color:#1b5e20;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.result-box{
    background:#f4f8ff;
    border:1px solid #dbe7f5;
    border-radius:12px;
    padding:20px;
    text-align:center;
}

.result-box h3{
    color:#555;
    font-size:15px;
    margin-bottom:10px;
}

.result-box p{
    color:#0d47a1;
    font-size:22px;
    font-weight:bold;
}

.info{
    margin-top:20px;
    background:#fff8e1;
    padding:15px;
    border-radius:10px;
    line-height:1.6;
}

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    .card{
        padding:18px;
    }

    .result-grid{
        grid-template-columns:1fr;
    }

    .button-area{
        flex-direction:column;
    }

    button,.back-btn{
        width:100%;
        text-align:center;
    }
}
</style>
</head>

<body>

<header>
    <h1>MyHelp India</h1>
    <p>Professional Percentage Calculator</p>
</header>

<div class="container">

    <div class="card">

        <h2>📊 Percentage Calculator</h2>

        <label>Enter Total / Original Value</label>

        <input
            type="number"
            id="total"
            placeholder="Example: 500"
            min="0"
            step="0.01"
        >

        <label>Enter Percentage (%)</label>

        <input
            type="number"
            id="percentage"
            placeholder="Example: 20"
            min="0"
            step="0.01"
        >

        <div class="button-area">

            <button
                class="calculate"
                onclick="calculatePercentage()"
            >
                🧮 Calculate
            </button>

            <button
                class="clear"
                onclick="clearCalculator()"
            >
                🗑️ Clear
            </button>

            <a
                href="index.html"
                class="back-btn"
            >
                ← Back to MyHelp India
            </a>

        </div>

    </div>


    <div class="card results" id="results">

        <h2>📊 Percentage Result</h2>

        <div class="answer">

            <h3>Percentage Value</h3>

            <p id="answer">0</p>

        </div>

        <div class="result-grid">

            <div class="result-box">

                <h3>Total Value</h3>

                <p id="showTotal">0</p>

            </div>

            <div class="result-box">

                <h3>Percentage</h3>

                <p id="showPercentage">0%</p>

            </div>

            <div class="result-box">

                <h3>Calculation</h3>

                <p id="calculation">0 × 0%</p>

            </div>

            <div class="result-box">

                <h3>Result</h3>

                <p id="resultText">0</p>

            </div>

        </div>

        <div class="info">

            <strong>💡 Example:</strong><br>
            If the total value is ₹500 and percentage is 20%,<br>
            the result is ₹100.

        </div>

    </div>

</div>


<script>

function calculatePercentage(){

    let total =
        Number(document.getElementById("total").value);

    let percentage =
        Number(document.getElementById("percentage").value);


    if(total < 0){

        alert("Please enter a valid total value.");

        return;
    }


    if(percentage < 0){

        alert("Please enter a valid percentage.");

        return;
    }


    if(
        document.getElementById("total").value === "" ||
        document.getElementById("percentage").value === ""
    ){

        alert("Please enter both values.");

        return;
    }


    let result =
        (total * percentage) / 100;


    document.getElementById("answer").innerText =
        result.toLocaleString("en-IN",{
            maximumFractionDigits:2
        });


    document.getElementById("showTotal").innerText =
        total.toLocaleString("en-IN");


    document.getElementById("showPercentage").innerText =
        percentage + "%";


    document.getElementById("calculation").innerText =
        total + " × " + percentage + "%";


    document.getElementById("resultText").innerText =
        result.toLocaleString("en-IN",{
            maximumFractionDigits:2
        });


    document.getElementById("results").style.display =
        "block";


    document.getElementById("results").scrollIntoView({
        behavior:"smooth"
    });

}


function clearCalculator(){

    document.getElementById("total").value = "";

    document.getElementById("percentage").value = "";

    document.getElementById("results").style.display =
        "none";

}

</script>

</body>
</html>
