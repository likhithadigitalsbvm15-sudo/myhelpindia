<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Currency Converter - MyHelp India</title>
<meta name="description" content="Free currency converter for converting Indian Rupees, US Dollars, Euros, Pounds and other currencies.">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f8ff;
    color: #222;
}

.header {
    background: linear-gradient(135deg, #0d47a1, #1976d2, #42a5f5);
    color: white;
    padding: 22px 15px;
    text-align: center;
}

.header h1 {
    font-size: 28px;
    margin-bottom: 6px;
}

.header p {
    font-size: 15px;
}

.container {
    max-width: 650px;
    margin: 30px auto;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.10);
}

.title {
    text-align: center;
    margin-bottom: 22px;
}

.title h2 {
    color: #0d47a1;
    margin-bottom: 5px;
}

.title p {
    color: #666;
    font-size: 14px;
}

label {
    display: block;
    font-weight: bold;
    margin: 15px 0 7px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

.row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    align-items: end;
}

.swap {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: #1976d2;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.swap:hover {
    background: #0d47a1;
}

.convert-btn {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #1976d2, #0d47a1);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.convert-btn:hover {
    opacity: 0.9;
}

.result {
    margin-top: 25px;
    padding: 20px;
    border-radius: 14px;
    background: #eef6ff;
    text-align: center;
    display: none;
}

.result .amount {
    font-size: 30px;
    font-weight: bold;
    color: #0d47a1;
    margin: 10px 0;
}

.rate {
    color: #555;
    font-size: 14px;
}

.info {
    margin-top: 20px;
    padding: 13px;
    background: #fff8e1;
    border-left: 4px solid #ffb300;
    border-radius: 8px;
    font-size: 13px;
    color: #555;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.clear-btn,
.back-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

.clear-btn {
    background: #eeeeee;
    color: #333;
}

.back-btn {
    background: #e3f2fd;
    color: #0d47a1;
}

.footer {
    text-align: center;
    margin: 25px 10px;
    color: #777;
    font-size: 13px;
}

@media (max-width: 600px) {
    .row {
        grid-template-columns: 1fr;
    }

    .swap {
        margin: 5px auto;
    }

    .card {
        padding: 18px;
    }

    .header h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>MyHelp India</h1>
    <p>Your Life • Our Support</p>
</div>

<div class="container">

    <div class="card">

        <div class="title">
            <h2>💱 Currency Converter</h2>
            <p>Convert different currencies easily</p>
        </div>

        <label>Amount</label>
        <input type="number" id="amount" placeholder="Enter amount" value="1" min="0">

        <div class="row">

            <div>
                <label>From</label>
                <select id="fromCurrency">
                    <option value="INR">🇮🇳 INR - Indian Rupee</option>
                    <option value="USD">🇺🇸 USD - US Dollar</option>
                    <option value="EUR">🇪🇺 EUR - Euro</option>
                    <option value="GBP">🇬🇧 GBP - British Pound</option>
                    <option value="AED">🇦🇪 AED - UAE Dirham</option>
                    <option value="SAR">🇸🇦 SAR - Saudi Riyal</option>
                    <option value="AUD">🇦🇺 AUD - Australian Dollar</option>
                    <option value="CAD">🇨🇦 CAD - Canadian Dollar</option>
                    <option value="SGD">🇸🇬 SGD - Singapore Dollar</option>
                    <option value="JPY">🇯🇵 JPY - Japanese Yen</option>
                </select>
            </div>

            <button class="swap" onclick="swapCurrency()" title="Swap currencies">
                ⇄
            </button>

            <div>
                <label>To</label>
                <select id="toCurrency">
                    <option value="USD">🇺🇸 USD - US Dollar</option>
                    <option value="INR">🇮🇳 INR - Indian Rupee</option>
                    <option value="EUR">🇪🇺 EUR - Euro</option>
                    <option value="GBP">🇬🇧 GBP - British Pound</option>
                    <option value="AED">🇦🇪 AED - UAE Dirham</option>
                    <option value="SAR">🇸🇦 SAR - Saudi Riyal</option>
                    <option value="AUD">🇦🇺 AUD - Australian Dollar</option>
                    <option value="CAD">🇨🇦 CAD - Canadian Dollar</option>
                    <option value="SGD">🇸🇬 SGD - Singapore Dollar</option>
                    <option value="JPY">🇯🇵 JPY - Japanese Yen</option>
                </select>
            </div>

        </div>

        <button class="convert-btn" onclick="convertCurrency()">
            Convert Currency
        </button>

        <div class="result" id="result">

            <div>Converted Amount</div>

            <div class="amount" id="convertedAmount">
                ₹0.00
            </div>

            <div class="rate" id="exchangeRate">
                Exchange Rate
            </div>

        </div>

        <div class="info">
            ℹ️ Exchange rates shown here are indicative/sample rates.
            Actual bank and market rates may be different.
        </div>

        <div class="buttons">
            <button class="clear-btn" onclick="clearAll()">
                Clear
            </button>

            <button class="back-btn" onclick="goHome()">
                ← MyHelp India
            </button>
        </div>

    </div>

</div>

<div class="footer">
    © 2026 MyHelp India • Your Life • Our Support
</div>


<script>

// Indicative rates based on INR
const rates = {
    INR: 1,
    USD: 0.0119,
    EUR: 0.0102,
    GBP: 0.0088,
    AED: 0.0437,
    SAR: 0.0446,
    AUD: 0.0167,
    CAD: 0.0161,
    SGD: 0.0152,
    JPY: 1.75
};


function convertCurrency() {

    let amount = parseFloat(document.getElementById("amount").value);

    let from = document.getElementById("fromCurrency").value;
    let to = document.getElementById("toCurrency").value;

    if (!amount || amount <= 0) {
        alert("Please enter a valid amount.");
        return;
    }

    let amountInINR = amount / rates[from];

    let converted = amountInINR * rates[to];

    let rate = rates[to] / rates[from];

    document.getElementById("convertedAmount").innerText =
        formatCurrency(converted, to);

    document.getElementById("exchangeRate").innerText =
        "1 " + from + " = " + rate.toFixed(4) + " " + to;

    document.getElementById("result").style.display = "block";
}


function formatCurrency(amount, currency) {

    let symbols = {
        INR: "₹",
        USD: "$",
        EUR: "€",
        GBP: "£",
        AED: "د.إ",
        SAR: "﷼",
        AUD: "A$",
        CAD: "C$",
        SGD: "S$",
        JPY: "¥"
    };

    return symbols[currency] + " " +
        amount.toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
}


function swapCurrency() {

    let from = document.getElementById("fromCurrency");
    let to = document.getElementById("toCurrency");

    let temp = from.value;

    from.value = to.value;
    to.value = temp;

    if (document.getElementById("amount").value) {
        convertCurrency();
    }
}


function clearAll() {

    document.getElementById("amount").value = "";

    document.getElementById("result").style.display = "none";
}


function goHome() {

    window.location.href = "index.html";
}

</script>

</body>
</html>
