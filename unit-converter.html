<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unit Converter - MyHelp India</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f8ff;
    color:#17345f;
}

.header{
    background:linear-gradient(135deg,#0d47a1,#1976d2,#42a5f5);
    color:white;
    text-align:center;
    padding:25px 15px;
}

.header h1{
    font-size:30px;
    margin-bottom:8px;
}

.header p{
    font-size:15px;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 8px 25px rgba(0,0,0,0.10);
}

.card h2{
    text-align:center;
    color:#0d47a1;
    margin-bottom:22px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

select,input{
    width:100%;
    padding:13px;
    border:1px solid #ccd8e8;
    border-radius:10px;
    font-size:16px;
    outline:none;
    background:white;
}

select:focus,
input:focus{
    border-color:#1976d2;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.swap{
    text-align:center;
    margin:5px 0 18px;
}

.swap button{
    background:#e9f2ff;
    color:#0d47a1;
    border:none;
    border-radius:50%;
    width:45px;
    height:45px;
    font-size:20px;
    cursor:pointer;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    flex:1;
    padding:13px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.convert{
    background:#1976d2;
    color:white;
}

.clear{
    background:#e9eef5;
    color:#17345f;
}

.result{
    display:none;
    margin-top:25px;
    padding:20px;
    background:#eef6ff;
    border-radius:15px;
    border:1px solid #c9e0fa;
    text-align:center;
}

.result h3{
    color:#0d47a1;
    margin-bottom:12px;
}

.result-value{
    font-size:30px;
    font-weight:bold;
    color:#1976d2;
    word-break:break-word;
}

.back{
    width:100%;
    margin-top:12px;
    background:#0d47a1;
    color:white;
}

.footer{
    text-align:center;
    margin-top:30px;
    padding:20px;
    color:#607d9b;
    font-size:14px;
}

@media(max-width:550px){
    .row{
        grid-template-columns:1fr;
    }

    .buttons{
        flex-direction:column;
    }

    .header h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🔄 Unit Converter</h1>
    <p>Convert length, weight, temperature, area and volume easily</p>
</div>

<div class="container">

<div class="card">

<h2>Unit Converter</h2>

<div class="input-group">
    <label>Conversion Type</label>

    <select id="category" onchange="loadUnits()">
        <option value="length">Length</option>
        <option value="weight">Weight</option>
        <option value="temperature">Temperature</option>
        <option value="area">Area</option>
        <option value="volume">Volume</option>
    </select>
</div>

<div class="row">

    <div class="input-group">
        <label>From</label>

        <select id="fromUnit"></select>
    </div>

    <div class="input-group">
        <label>To</label>

        <select id="toUnit"></select>
    </div>

</div>

<div class="input-group">
    <label>Enter Value</label>
    <input type="number" id="value" placeholder="Enter value">
</div>

<div class="swap">
    <button onclick="swapUnits()" title="Swap Units">↕</button>
</div>

<div class="buttons">

    <button class="convert" onclick="convertUnit()">
        Convert
    </button>

    <button class="clear" onclick="clearAll()">
        Clear
    </button>

</div>

<div class="result" id="result">

    <h3>Conversion Result</h3>

    <div class="result-value" id="resultValue">
        0
    </div>

</div>

<button class="back" onclick="goBack()">
    ← Back to MyHelp India
</button>

</div>

<div class="footer">
    © 2026 MyHelp India • Simple Solutions for a Better Life
</div>

</div>

<script>

const units = {

    length: {
        "Kilometer (km)": 1000,
        "Meter (m)": 1,
        "Centimeter (cm)": 0.01,
        "Millimeter (mm)": 0.001,
        "Mile (mi)": 1609.344,
        "Yard (yd)": 0.9144,
        "Foot (ft)": 0.3048,
        "Inch (in)": 0.0254
    },

    weight: {
        "Kilogram (kg)": 1,
        "Gram (g)": 0.001,
        "Milligram (mg)": 0.000001,
        "Pound (lb)": 0.45359237,
        "Ounce (oz)": 0.0283495231
    },

    temperature: {
        "Celsius (°C)": "C",
        "Fahrenheit (°F)": "F",
        "Kelvin (K)": "K"
    },

    area: {
        "Square Meter (m²)": 1,
        "Square Kilometer (km²)": 1000000,
        "Square Foot (ft²)": 0.09290304,
        "Square Yard (yd²)": 0.83612736,
        "Acre": 4046.8564224,
        "Hectare": 10000
    },

    volume: {
        "Liter (L)": 1,
        "Milliliter (mL)": 0.001,
        "Cubic Meter (m³)": 1000,
        "Cubic Foot (ft³)": 28.316846592,
        "Gallon (US)": 3.785411784,
        "Cup (US)": 0.2365882365
    }

};

function loadUnits(){

    const category =
        document.getElementById("category").value;

    const from =
        document.getElementById("fromUnit");

    const to =
        document.getElementById("toUnit");

    from.innerHTML = "";
    to.innerHTML = "";

    Object.keys(units[category]).forEach(unit => {

        let option1 =
            document.createElement("option");

        option1.value = unit;
        option1.textContent = unit;

        let option2 =
            document.createElement("option");

        option2.value = unit;
        option2.textContent = unit;

        from.appendChild(option1);
        to.appendChild(option2);

    });

    if(to.options.length > 1){
        to.selectedIndex = 1;
    }

    document.getElementById("result").style.display = "none";
}

function convertTemperature(value,from,to){

    let celsius;

    if(from === "Celsius (°C)"){
        celsius = value;
    }
    else if(from === "Fahrenheit (°F)"){
        celsius = (value - 32) * 5 / 9;
    }
    else{
        celsius = value - 273.15;
    }

    if(to === "Celsius (°C)"){
        return celsius;
    }

    if(to === "Fahrenheit (°F)"){
        return (celsius * 9 / 5) + 32;
    }

    return celsius + 273.15;
}

function convertUnit(){

    const category =
        document.getElementById("category").value;

    const from =
        document.getElementById("fromUnit").value;

    const to =
        document.getElementById("toUnit").value;

    const value =
        parseFloat(document.getElementById("value").value);

    if(isNaN(value)){
        alert("Please enter a value.");
        return;
    }

    let result;

    if(category === "temperature"){

        result =
            convertTemperature(value,from,to);

    }
    else{

        let baseValue =
            value * units[category][from];

        result =
            baseValue / units[category][to];

    }

    let formatted;

    if(result === 0){
        formatted = "0";
    }
    else{
        formatted =
            Number(result.toPrecision(12)).toLocaleString();
    }

    document.getElementById("resultValue").textContent =
        formatted + " " + to;

    document.getElementById("result").style.display =
        "block";
}

function swapUnits(){

    const from =
        document.getElementById("fromUnit");

    const to =
        document.getElementById("toUnit");

    const temp = from.value;

    from.value = to.value;
    to.value = temp;

    convertUnit();
}

function clearAll(){

    document.getElementById("value").value = "";

    document.getElementById("result").style.display =
        "none";
}

function goBack(){

    window.location.href = "index.html";

}

loadUnits();

</script>

</body>
</html>
