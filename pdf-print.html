<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Print - MyHelp India</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f8ff;
    color:#222;
}

.header{
    background:linear-gradient(135deg,#0d47a1,#1976d2,#42a5f5);
    color:white;
    text-align:center;
    padding:25px 15px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:8px 0 0;
    font-size:15px;
}

.container{
    max-width:750px;
    margin:25px auto;
    padding:15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

label{
    display:block;
    margin-top:17px;
    margin-bottom:7px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
    background:white;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.preview-btn{
    background:#1976d2;
    color:white;
}

.print-btn{
    background:#198754;
    color:white;
    display:none;
}

.clear-btn{
    background:#e9ecef;
    color:#333;
}

.back-btn{
    background:#0d47a1;
    color:white;
}

.file-info{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#f8f9fa;
    border-radius:8px;
}

.status{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#eef6ff;
    border-left:5px solid #1976d2;
    border-radius:8px;
    line-height:1.6;
}

.preview-area{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#ddd;
    border-radius:10px;
}

.preview-page{
    background:white;
    margin:15px auto;
    box-shadow:0 2px 10px rgba(0,0,0,.20);
    text-align:center;
    overflow:hidden;
}

.preview-page canvas{
    display:block;
    max-width:100%;
    height:auto;
    margin:auto;
}

.info{
    margin-top:18px;
    padding:13px;
    background:#fff8e1;
    border-left:5px solid #ffb300;
    border-radius:8px;
    font-size:14px;
    line-height:1.6;
}

.footer{
    text-align:center;
    padding:25px;
    color:#666;
    font-size:13px;
}

@media(max-width:600px){
    .header h1{
        font-size:25px;
    }

    .card{
        padding:18px;
    }
}

@media print{

    body{
        background:white;
    }

    .header,
    .container > .card,
    .footer{
        display:none !important;
    }

    .preview-area{
        display:block !important;
        background:white;
        padding:0;
        margin:0;
    }

    .preview-page{
        box-shadow:none;
        margin:0;
        page-break-after:always;
    }

    .preview-page:last-child{
        page-break-after:auto;
    }

    @page{
        margin:0;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🖨️ PDF Print</h1>
    <p>Preview and print your PDF easily</p>
</div>

<div class="container">

<div class="card">

    <label>Select PDF File</label>

    <input
        type="file"
        id="pdfFile"
        accept=".pdf,application/pdf"
    >

    <div class="file-info" id="fileInfo"></div>

    <label>Page Range</label>

    <input
        type="text"
        id="pageRange"
        placeholder="Example: 1-3 or 1,3,5"
    >

    <div style="font-size:13px;color:#666;margin-top:6px;">
        Leave empty to print all pages.
    </div>

    <label>Paper Size</label>

    <select id="paperSize">
        <option value="A4">A4</option>
        <option value="Letter">Letter</option>
        <option value="A5">A5</option>
    </select>

    <label>Orientation</label>

    <select id="orientation">
        <option value="portrait">Portrait</option>
        <option value="landscape">Landscape</option>
    </select>

    <label>Print Quality</label>

    <select id="quality">
        <option value="1.5">Standard</option>
        <option value="2" selected>High Quality</option>
        <option value="2.5">Very High Quality</option>
    </select>

    <button
        class="preview-btn"
        onclick="createPreview()">
        👁️ Create Print Preview
    </button>

    <button
        class="print-btn"
        id="printBtn"
        onclick="printPDF()">
        🖨️ Print / Save as PDF
    </button>

    <button
        class="clear-btn"
        onclick="clearAll()">
        🗑️ Clear
    </button>

    <button
        class="back-btn"
        onclick="goBack()">
        ← Back to MyHelp India
    </button>

    <div class="status" id="status"></div>

    <div class="info">
        <b>ℹ️ How it works:</b><br>
        Select a PDF → Choose pages → Select paper size and orientation →
        Create preview → Print or choose <b>Save as PDF</b>.
        <br><br>
        Your PDF is processed in your browser.
    </div>

</div>

<div class="preview-area" id="previewArea"></div>

</div>

<div class="footer">
    © 2026 MyHelp India • Simple & Helpful Tools
</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let selectedFile = null;

document.getElementById("pdfFile").addEventListener(
    "change",
    function(){

        selectedFile = this.files[0];

        if(!selectedFile){
            return;
        }

        const info =
            document.getElementById("fileInfo");

        info.style.display = "block";

        info.innerHTML =
            "<b>Selected PDF:</b> " +
            escapeHTML(selectedFile.name) +
            "<br><b>File Size:</b> " +
            formatBytes(selectedFile.size);

    }
);

async function createPreview(){

    if(!selectedFile){

        alert("Please select a PDF file first.");

        return;
    }

    const status =
        document.getElementById("status");

    const previewArea =
        document.getElementById("previewArea");

    const printBtn =
        document.getElementById("printBtn");

    status.style.display = "block";

    status.innerHTML =
        "⏳ Loading PDF... Please wait.";

    previewArea.innerHTML = "";

    try{

        const arrayBuffer =
            await selectedFile.arrayBuffer();

        const pdf =
            await pdfjsLib.getDocument({
                data:arrayBuffer
            }).promise;

        const totalPages =
            pdf.numPages;

        const rangeText =
            document.getElementById("pageRange").value.trim();

        const pages =
            parsePageRange(
                rangeText,
                totalPages
            );

        if(pages.length === 0){

            alert("Invalid page range.");

            status.style.display = "none";

            return;
        }

        const quality =
            parseFloat(
                document.getElementById("quality").value
            );

        const orientation =
            document.getElementById("orientation").value;

        const paperSize =
            document.getElementById("paperSize").value;

        for(let i=0;i<pages.length;i++){

            const pageNumber =
                pages[i];

            const page =
                await pdf.getPage(pageNumber);

            const viewport =
                page.getViewport({
                    scale:quality
                });

            const canvas =
                document.createElement("canvas");

            const context =
                canvas.getContext("2d");

            canvas.width =
                Math.floor(viewport.width);

            canvas.height =
                Math.floor(viewport.height);

            await page.render({
                canvasContext:context,
                viewport:viewport
            }).promise;

            const pageBox =
                document.createElement("div");

            pageBox.className =
                "preview-page";

            applyPaperSize(
                pageBox,
                paperSize,
                orientation
            );

            const canvasDisplay =
                document.createElement("canvas");

            canvasDisplay.width =
                canvas.width;

            canvasDisplay.height =
                canvas.height;

            const displayContext =
                canvasDisplay.getContext("2d");

            displayContext.drawImage(
                canvas,
                0,
                0
            );

            canvasDisplay.style.maxWidth =
                "100%";

            canvasDisplay.style.height =
                "auto";

            pageBox.appendChild(
                canvasDisplay
            );

            previewArea.appendChild(
                pageBox
            );

            status.innerHTML =
                "📄 Preparing preview...<br>" +
                "Page <b>" +
                (i + 1) +
                "</b> of <b>" +
                pages.length +
                "</b>";
        }

        previewArea.style.display = "block";

        printBtn.style.display = "block";

        status.innerHTML =
            "✅ <b>Print Preview Ready!</b><br>" +
            pages.length +
            " page(s) prepared.";

        window.scrollTo({
            top:previewArea.offsetTop,
            behavior:"smooth"
        });

    }
    catch(error){

        console.error(error);

        status.innerHTML =
            "❌ Unable to read this PDF.<br>" +
            "Please select a valid PDF file.";

    }

}

function parsePageRange(text,total){

    if(!text){
        return Array.from(
            {length:total},
            (_,i)=>i+1
        );
    }

    const result = new Set();

    const parts =
        text.split(",");

    for(const part of parts){

        const value =
            part.trim();

        if(!value){
            continue;
        }

        if(value.includes("-")){

            const range =
                value.split("-");

            if(range.length !== 2){
                continue;
            }

            let start =
                parseInt(range[0]);

            let end =
                parseInt(range[1]);

            if(isNaN(start) || isNaN(end)){
                continue;
            }

            if(start > end){

                const temp = start;

                start = end;

                end = temp;
            }

            start =
                Math.max(1,start);

            end =
                Math.min(total,end);

            for(let i=start;i<=end;i++){
                result.add(i);
            }

        }
        else{

            const page =
                parseInt(value);

            if(
                !isNaN(page) &&
                page >= 1 &&
                page <= total
            ){
                result.add(page);
            }

        }

    }

    return Array.from(result).sort(
        (a,b)=>a-b
    );
}

function applyPaperSize(
    element,
    paper,
    orientation
){

    let width;
    let height;

    if(paper === "A4"){
        width = "210mm";
        height = "297mm";
    }

    if(paper === "Letter"){
        width = "8.5in";
        height = "11in";
    }

    if(paper === "A5"){
        width = "148mm";
        height = "210mm";
    }

    if(orientation === "landscape"){

        const temp = width;

        width = height;

        height = temp;
    }

    element.style.width = width;
    element.style.minHeight = height;
}

function printPDF(){

    window.print();

}

function clearAll(){

    document.getElementById("pdfFile").value = "";

    document.getElementById("pageRange").value = "";

    document.getElementById("fileInfo").style.display =
        "none";

    document.getElementById("status").style.display =
        "none";

    document.getElementById("previewArea").style.display =
        "none";

    document.getElementById("previewArea").innerHTML =
        "";

    document.getElementById("printBtn").style.display =
        "none";

    selectedFile = null;

}

function goBack(){

    window.location.href =
        "index.html";

}

function formatBytes(bytes){

    if(bytes === 0){
        return "0 Bytes";
    }

    const sizes =
        ["Bytes","KB","MB","GB"];

    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        Math.round(
            bytes /
            Math.pow(1024,i) *
            100
        ) / 100
    ) +
    " " +
    sizes[i];
}

function escapeHTML(text){

    return text.replace(
        /[&<>"']/g,
        function(char){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[char];

        }
    );

}

</script>

</body>
</html>
